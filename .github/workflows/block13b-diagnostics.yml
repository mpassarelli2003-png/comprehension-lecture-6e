name: Block 13b diagnostics

on:
  push:
    branches:
      - agent/block13b-real-writing-feedback-flow
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:block13b
      - run: npm run build
