name: Block 15b diagnostics

on:
  push:
    branches:
      - agent/block15b-real-integrated-journey-tests
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/block15b-real-integrated-journey-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:block15b
      - run: npm run build
