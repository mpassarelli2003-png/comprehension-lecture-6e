name: Block 17 browser recipe

on:
  push:
    branches:
      - main
      - agent/browser-accessibility-recipe
  pull_request:
    branches:
      - main

jobs:
  browser-recipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ADMIN_PASSWORD: block17-browser-password
      ADMIN_SESSION_SECRET: block17-browser-session-secret-for-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:block17
      - name: Conserver le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
