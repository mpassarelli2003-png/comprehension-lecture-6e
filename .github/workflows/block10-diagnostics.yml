name: Block 10 diagnostics

on:
  push:
    branches:
      - agent/local-exercise-workshop
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:block10
      - run: npm run build
