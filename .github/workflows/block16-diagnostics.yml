name: Block 16 diagnostics

on:
  push:
    branches:
      - agent/integrated-user-guide
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrated-user-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:block16
      - run: npm run build
