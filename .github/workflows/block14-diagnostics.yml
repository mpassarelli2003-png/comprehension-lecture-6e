name: Block 14 diagnostics

on:
  push:
    branches:
      - agent/writing-revision-history
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:block14
      - run: npm run build
