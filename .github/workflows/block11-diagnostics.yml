name: Block 11 diagnostics

on:
  push:
    branches:
      - agent/publication-readiness-gate

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:block11
      - run: npm run build
